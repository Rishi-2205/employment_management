<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div class="container">
    <h1 style="text-align: center;">Employee Management Portal!</h1>

    <!-- Login Section -->
    <div id="login-section" class="card">
      <input type="text" id="login-email" placeholder="Enter your email" />
      <input type="password" id="login-password" placeholder="Enter your password" />
      <button onclick="login()">Login</button>
      <div id="login-error" class="error"></div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" style="display: none;">
      <div class="top-bar">
        <button onclick="logout()">Logout</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="profile" onclick="openTab('profile')">My Profile</button>
        <button class="tab-btn" data-tab="attendance" onclick="openTab('attendance')">Attendance</button>
        <button class="tab-btn" data-tab="employees" onclick="openTab('employees')">Employees</button>
        <button class="tab-btn" data-tab="roles" onclick="openTab('roles')">Roles</button>
        <button class="tab-btn" data-tab="projects" onclick="openTab('projects')">Projects</button>
        <button class="tab-btn" data-tab="myinfo" onclick="openTab('myinfo')">My Info</button>

      </div>
      <div id="tab-content"></div>
    </div>
  </div>

  
  <script src="script.js"></script>
</body>
</html>
